# pnpm の設定（workspace としては使わない。tech-spec §13.2）
minimumReleaseAge: 14400
minimumReleaseAgeStrict: true
# ビルドスクリプトの実行を許すパッケージ。追加するときは理由を PR に書く（tech-spec §13.3）
# false: スクリプトを実行しない。pnpm 12 は未決のものがあると install を失敗させるため、明示する
allowBuilds:
  # wrangler の依存（esbuild は vite も使う）。スクリプトを実行しなくても pnpm build と
  # pnpm preview（wrangler pages dev、workerd）が動くことを実測で確認した（2026-09-10、spec D で再確認）。
  # どちらも実行ファイルをプラットフォーム別の optionalDependencies で受け取り、postinstall は主に検証を行う
  esbuild: false
  # postinstall で git フックを入れるパッケージ。許可せず、package.json の prepare（lefthook install）で
  # フックを入れる。ルートのプロジェクト自身のライフサイクルスクリプトは実行されるため（tech-spec §13.3）
  lefthook: false
  workerd: false
# 依存の版の差し替え。miniflare（wrangler の依存）は undici を 7.29.0 に固定しているが、7.29.0 には
# pnpm audit の high を含む脆弱性があり、修正版の 7.29.1 を使う miniflare はまだ出ていない（2026-10-03）。
# パッチ版だけを差し替える。miniflare が 7.29.1 以上を使うようになったら消す
overrides:
  miniflare>undici: 7.29.1
